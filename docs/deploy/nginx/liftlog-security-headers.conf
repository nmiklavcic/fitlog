# /etc/nginx/snippets/liftlog-security-headers.conf: headers for files Nginx serves itself.
# (Responses from Django already carry HSTS, nosniff, X-Frame-Options and Referrer-Policy.)
add_header Strict-Transport-Security "max-age=31536000" always;
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
add_header Referrer-Policy "same-origin" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
# Everything is same-origin. data: = 2FA QR code, blob: = photo preview before upload,
# 'unsafe-inline' styles = inline style attributes used by the charts.
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; connect-src 'self'; font-src 'self'; object-src 'none'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
