# /etc/nginx/snippets/liftlog-proxy.conf: shared settings for locations proxied to Gunicorn.
proxy_pass http://liftlog_app;
proxy_http_version 1.1;
proxy_set_header Connection "";
# $http_host keeps the port the browser used (e.g. localhost:8443 through Vagrant port
# forwarding). With plain $host Django would see "localhost" while the browser sends
# Origin "https://localhost:8443", and the CSRF origin check would fail. Django still
# validates this header against ALLOWED_HOSTS.
proxy_set_header Host $http_host;
proxy_set_header X-Real-IP $remote_addr;
# Django takes the client IP from the *last* entry (the one Nginx appends).
proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
# Tells Django the original request was HTTPS (SECURE_PROXY_SSL_HEADER).
proxy_set_header X-Forwarded-Proto $scheme;
# Same ID in the Nginx access log and every Django log line for this request.
proxy_set_header X-Request-ID $request_id;
proxy_connect_timeout 5s;
proxy_read_timeout 60s;
