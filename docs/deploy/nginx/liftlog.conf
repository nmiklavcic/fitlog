# Liftlog: Nginx site (reference). Install as /etc/nginx/sites-available/liftlog
# and symlink it into sites-enabled. Replace before use:
#   liftlog.example.com           -> your hostname
#   CHANGE_ME_MEDIA_SIGNING_SECRET -> the MEDIA_URL_SIGNING_SECRET from /etc/liftlog/liftlog.env
#   certificate paths             -> certbot (public host) or a self-signed / mkcert cert (Vagrant)
# This file contains a secret: keep it readable by root only (chmod 640).
#
# Needs the secure_link module, included in Ubuntu's nginx package:
#   nginx -V 2>&1 | grep -o with-http_secure_link_module

# Rate limits per client IP (shared memory zones; 10 MB holds ~160k IPs).
limit_req_zone $binary_remote_addr zone=liftlog_auth:10m rate=10r/m;
limit_req_zone $binary_remote_addr zone=liftlog_api:10m rate=20r/s;

# One JSON object per request: easy to ship to Loki/Elasticsearch and to join with
# the Django logs through request_id.
log_format liftlog_json escape=json
  '{"ts":"$time_iso8601","request_id":"$request_id","remote_addr":"$remote_addr",'
  '"method":"$request_method","uri":"$request_uri","status":$status,"bytes":$body_bytes_sent,'
  '"request_time":$request_time,"upstream_time":"$upstream_response_time","user_agent":"$http_user_agent"}';

upstream liftlog_app {
    server 127.0.0.1:8000;  # Gunicorn (never exposed directly)
    keepalive 16;
}

server {
    listen 80;
    listen [::]:80;
    server_name liftlog.example.com;

    # certbot --webroot answers the Let's Encrypt HTTP-01 challenge from here.
    location /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
    }
    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    # Nginx >= 1.25 prefers a separate "http2 on;" line; this form works on 1.18-1.26.
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name liftlog.example.com;

    ssl_certificate     /etc/letsencrypt/live/liftlog.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/liftlog.example.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:liftlog_ssl:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    access_log /var/log/nginx/liftlog.access.log liftlog_json;
    error_log  /var/log/nginx/liftlog.error.log warn;

    server_tokens off;
    client_max_body_size 12m;  # photos are limited to 10 MB by the app

    gzip on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # Built React app (frontend/dist).
    root /opt/liftlog/frontend/dist;

    # Note: a location with its own add_header doesn't inherit the server's headers,
    # so the security headers live in a snippet included where needed. Proxied
    # locations get these headers from Django instead.

    # SPA: unknown paths serve index.html and React Router takes over.
    location / {
        include /etc/nginx/snippets/liftlog-security-headers.conf;
        add_header Cache-Control "no-cache" always;  # always revalidate index.html
        try_files $uri /index.html;
    }

    # Vite puts a content hash in every asset file name, so they never change.
    location /assets/ {
        include /etc/nginx/snippets/liftlog-security-headers.conf;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    # Brute-force protection in front of Django's own throttles and lockout.
    location ~ ^/api/auth/(login|register|password)/ {
        limit_req zone=liftlog_auth burst=5 nodelay;
        limit_req_status 429;
        include /etc/nginx/snippets/liftlog-proxy.conf;
    }

    # Stripe webhooks: no rate limit (Stripe retries in bursts); Django checks the signature.
    location = /api/billing/webhook/ {
        include /etc/nginx/snippets/liftlog-proxy.conf;
    }

    location /api/ {
        limit_req zone=liftlog_api burst=40 nodelay;
        limit_req_status 429;
        include /etc/nginx/snippets/liftlog-proxy.conf;
    }

    # Django admin (superuser only). Optionally restrict by IP:
    #   allow 192.168.56.0/24; deny all;
    location /admin/ {
        include /etc/nginx/snippets/liftlog-proxy.conf;
    }

    # Django admin's CSS/JS (manage.py collectstatic -> STATIC_ROOT).
    location /static/ {
        alias /var/lib/liftlog/static/;
        include /etc/nginx/snippets/liftlog-security-headers.conf;
        add_header Cache-Control "public, max-age=2592000" always;
    }

    # User photos: served only with a valid, unexpired signature (see apps/core/signing.py).
    # Django signs URLs after checking who may see the post; Nginx verifies them here
    # without calling Django at all.
    location /media/ {
        secure_link $arg_s,$arg_e;
        secure_link_md5 "$secure_link_expires$uri CHANGE_ME_MEDIA_SIGNING_SECRET";
        if ($secure_link = "") { return 403; }  # missing or forged signature
        if ($secure_link = "0") { return 410; }  # signature fine, link expired
        alias /var/lib/liftlog/media/;
        include /etc/nginx/snippets/liftlog-security-headers.conf;
        add_header Cache-Control "private, max-age=21600" always;
    }

    # Prometheus scrapes Gunicorn directly on 127.0.0.1:8000/metrics; never publicly.
    location = /metrics {
        return 404;
    }
}
